plugins {
    id 'java'
    id 'antlr'
}

repositories {
	mavenCentral()
}

dependencies {
    antlr "org.antlr:antlr4:4.13.1"
    implementation "org.antlr:antlr4-runtime:4.13.1"

	testImplementation "junit:junit:4.12"
}

compileJava {
    dependsOn generateGrammarSource
}

generateGrammarSource {
    arguments += ['-visitor', '-listener']
}